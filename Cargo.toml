[package]
name = "whatport"
version = "0.1.0"
edition = "2021"
description = "lsof | awk | kill, but one command — finds (and optionally kills) whatever process is bound to a TCP port, no lsof binary required"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/whatport"
readme = "README.md"
keywords = ["port", "process", "kill", "lsof", "cli"]
categories = ["command-line-utilities"]

[lib]
name = "whatport"
path = "src/lib.rs"

[[bin]]
name = "whatport"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
nix = { version = "0.29", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
